# Builds the image, one per Swift version, and checks the tools in it start.
#
#   pull request              build and check only
#   tag vX.Y.Z                build, check, and publish to GHCR as swift-<version> (what the graft
#                             command pulls) and swift-<version>-X.Y.Z (fixed, for going back)
#   Run workflow (Actions)    build and check; publish too with "publish" ticked, as
#                             swift-<version>-<short commit>
#
# The image has no Apple software in it (README.md, Trademarks): the SDK is made on each machine.
name: Image

on:
  pull_request:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the image (tagged with the commit)
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      matrix:
        # The Swift whose Xcode users make the SDK from: 6.4.1 for Xcode 27.1.
        swift: ["6.4.1"]
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      # The build peaks at about 20 GB; the runner has about 14 GB free until its preinstalled
      # SDKs go.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker image prune -af
          df -h /

      - name: Build
        run: docker build -t graft --build-arg SWIFT_VERSION=${{ matrix.swift }} .

      - name: Check
        run: |
          docker run --rm --user dev --entrypoint bash graft -c '
            set -e
            swift --version | grep -F "Swift version ${{ matrix.swift }} "
            xtool --version
            rcodesign --version
            /home/dev/pymobile3-venv/bin/pymobiledevice3 version
            test -x /home/dev/omarchy-apple-dev/tools/darwin-tools/.build/release/actool
            for f in /usr/local/share/graft/launcher /usr/local/bin/graft-*; do bash -n "$f"; done
            grep -q "^# graft.s copy" /home/dev/omarchy-apple-dev/tools/xcodeproj2xtool.py
            python3 /home/dev/omarchy-apple-dev/tools/xcodeproj2xtool.py --self-test'

      - name: Tags
        id: tags
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        run: |
          base=$IMAGE:swift-${{ matrix.swift }}
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "list=$base $base-${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "list=$base-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.tags.outputs.list
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for tag in ${{ steps.tags.outputs.list }}; do
            docker tag graft "$tag"
            docker push "$tag"
          done
