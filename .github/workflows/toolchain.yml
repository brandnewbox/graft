# Builds graft's toolchain images (toolchain/), one per Xcode in toolchains, and checks the tools in
# them start.
#
#   pull request              build and check
#   push to main              build, check and publish
#   Run workflow (Actions)    build, check and publish every Xcode
#
# Which Xcodes: every one when toolchain/ or this file changes; when only toolchains changes, the
# ones not pinned by digest yet (a new Xcode). So pinning a digest doesn't build again. Each image
# publishes as graft-toolchain:xcode-<Xcode> and graft-toolchain:xcode-<Xcode>-<short commit>, and
# the job's summary has its line for toolchains, pinned by digest. graft runs only the images
# toolchains pins, so a publish changes nothing for users until a CLI release pins it (RELEASE.md).
#
# The images have no Apple software in them (README.md, Trademarks): the SDK is made on each machine.
name: Toolchain

on:
  pull_request:
    paths: [toolchain/**, toolchains, .github/workflows/toolchain.yml]
  push:
    branches: [main]
    paths: [toolchain/**, toolchains, .github/workflows/toolchain.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Which Xcodes
        id: plan
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          all=0
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] ||
            git diff --name-only "$BASE" HEAD | grep -qE '^(toolchain/|\.github/workflows/toolchain\.yml$)'; then
            all=1
          fi
          matrix=$(awk -v all="$all" '{ sub(/#.*/, "") } NF == 3 && (all || $3 !~ /@sha256:/) {
            printf "%s{\"xcode\":\"%s\",\"swift\":\"%s\"}", n++ ? "," : "", $1, $2 }' toolchains)
          echo "matrix=[$matrix]" >> "$GITHUB_OUTPUT"
          echo "Building: [$matrix]"

  image:
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      IMAGE: ghcr.io/${{ github.repository }}-toolchain
    steps:
      - uses: actions/checkout@v4

      # The build peaks at about 20 GB; the runner has about 14 GB free until its preinstalled
      # SDKs go.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker image prune -af
          df -h /

      - name: Build
        run: |
          docker build -t toolchain --build-arg XCODE_VERSION=${{ matrix.xcode }} \
            --build-arg SWIFT_VERSION=${{ matrix.swift }} toolchain

      # The tools, and what graft's commands (libexec/) use from the image.
      - name: Check
        run: |
          docker run --rm --user dev --entrypoint bash toolchain -c '
            set -e
            swift --version | grep -F "Swift version ${{ matrix.swift }} "
            test "$GRAFT_XCODE" = "${{ matrix.xcode }}"
            xtool --version
            rcodesign --version
            /home/dev/pymobile3-venv/bin/pymobiledevice3 version
            O=/home/dev/omarchy-apple-dev
            test -x $O/tools/darwin-tools/.build/release/actool
            for f in ship.sh tools/sign-dev.sh tools/tailnet-tunnel.py tools/asc.py tools/xip_version.py; do test -e $O/$f; done
            for f in /usr/local/bin/{entrypoint.sh,home-writable,installer-steps,setup-sdk}; do bash -n "$f"; done
            test -s /usr/local/share/graft-toolchain/sdk-tools'
          test "$(docker image inspect -f '{{ index .Config.Labels "org.brandnewbox.graft.xcode" }}' toolchain)" = "${{ matrix.xcode }}"
          # graft's commands run from the mount, as dev: graft-devices with none says so.
          out=$(docker run --rm -v "$PWD/libexec:/opt/graft/bin:ro" toolchain graft-devices 2>&1 || true)
          echo "$out"
          grep -q 'no devices' <<<"$out"

      - name: Publish
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          base=$IMAGE:xcode-${{ matrix.xcode }}
          for tag in "$base" "$base-${GITHUB_SHA::7}"; do
            docker tag toolchain "$tag"
            docker push "$tag"
          done
          pinned=$(docker image inspect -f '{{ index .RepoDigests 0 }}' "$base")
          {
            echo "Published $base-${GITHUB_SHA::7}. Its line for toolchains:"
            echo
            echo '```'
            echo "${{ matrix.xcode }}     ${{ matrix.swift }}  $pinned"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
